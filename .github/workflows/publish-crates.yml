name: Publish crates.io packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v2.1.0
        required: true
        type: string
      resume:
        description: Skip versions that already exist after a reviewed partial publication
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-io-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          override: true

      - name: Verify the tag and release branch
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          workspace_version="$(awk -F ' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)"
          test "$RELEASE_TAG" = "v$workspace_version"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"
          release_series="${workspace_version%%[-+]*}"
          release_branch="release/v${release_series%.*}.x"
          git fetch --quiet origin "$release_branch:refs/remotes/origin/$release_branch"
          git merge-base --is-ancestor HEAD "origin/$release_branch"
          test -z "$(git status --porcelain)"

      - name: Verify CLI release assets are ready
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          version="${RELEASE_TAG#v}"
          for target in x86_64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            archive="nexus-cli-${version}-${target}.tar.gz"
            grep -Fx "$archive" <<< "$release_assets"
            grep -Fx "$archive.sha256" <<< "$release_assets"
          done
          deb="nexus-cli_${version}-1_amd64.deb"
          grep -Fx "$deb" <<< "$release_assets"
          grep -Fx "$deb.sha256" <<< "$release_assets"

      - name: Request a crates.io token
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish packages
        env:
          ALLOW_EXISTING: ${{ inputs.resume }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          PUBLISH_CRATES_CONFIRM: ${{ inputs.tag }}
        run: ./scripts/publish-crates.sh "$PUBLISH_CRATES_CONFIRM"
