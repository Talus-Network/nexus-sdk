# Release process for the Nexus SDK:
#
# * checks for a Git Tag in the format v*
# * builds artifacts (archives, installers, hashes)
# * uploads artifacts to workflow
# * after every build succeeds, uploads artifacts to a draft GitHub Release
#
# The GitHub Release will be created with a generated
# body based on the changelog.

name: Release

# This task will run whenever you push a git tag that looks like a version
# like "v1.0.0", "v0.1.0-alpha.1"
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  CLICOLOR: 1
  RUSTFLAGS: >
    -C codegen-units=1

jobs:
  packages:
    name: Verify crate archives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-packages

      - name: Verify crate archives
        run: ./scripts/check-packages.sh

  cli:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            deb: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: Cargo.toml
          field: workspace.package.version

      - name: Validate tag matches version
        if: github.ref_type == 'tag'
        env:
          PACKAGE_VERSION: ${{ steps.get_version.outputs.value }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_tag="v${PACKAGE_VERSION}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cross-compilation tools
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Install build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt install -y musl-tools pkg-config

      - name: Cache Build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --package=nexus-cli --release --locked --target=${{ matrix.target }} $BUILD_STD

      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        if: ${{ matrix.deb == true }}
        with:
          tool: cargo-deb

      - name: Build deb
        if: ${{ matrix.deb == true }}
        run: cargo deb --package=nexus-cli --no-build --output=. --target=${{ matrix.target }}

      - name: Package
        run: |
          tar -cv CHANGELOG.md LICENSE README.md \
            -C target/${{ matrix.target }}/release/ nexus |
            gzip --best > \
            nexus-cli-${{ steps.get_version.outputs.value }}-${{ matrix.target }}.tar.gz

      - name: Create checksums
        run: |
          for artifact in *.deb *.tar.gz *.zip; do
            if [[ -f "$artifact" ]]; then
              shasum -a 256 "$artifact" > "$artifact.sha256"
            fi
          done

      - name: Verify packaged binary
        env:
          PACKAGE_VERSION: ${{ steps.get_version.outputs.value }}
          TARGET: ${{ matrix.target }}
        run: |
          archive="nexus-cli-${PACKAGE_VERSION}-${TARGET}.tar.gz"
          shasum -a 256 --check "$archive.sha256"
          mkdir smoke-test
          tar -xzf "$archive" -C smoke-test
          test "$(smoke-test/nexus --version)" = "nexus-cli ${PACKAGE_VERSION}"
          smoke-test/nexus --help > /dev/null
          smoke-test/nexus tap test --help > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            *.deb
            *.tar.gz
            *.zip
            *.sha256

  draft:
    name: Create draft release
    needs: [packages, cli]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify checksums
        working-directory: release-assets
        run: shasum -a 256 --check *.sha256

      - name: Read release notes
        id: notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          changelog = Path("CHANGELOG.md").read_text()
          heading = f"## [`{version}`]"
          body = changelog.split(heading, 1)[1].split("\n", 1)[1].split("\n## ", 1)[0].strip()
          if not body:
              raise SystemExit(f"Missing release notes for {version}")
          Path("release-notes.md").write_text(body + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(steps.notes.outputs.version, '-') }}
          draft: true
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
