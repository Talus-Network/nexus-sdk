[package]
name = "nexus-cli"
description = "Nexus CLI provides an interface to interact with the Nexus Workflow."

edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "nexus"
path = "src/main.rs"

[features]
upgrade_test = ["nexus-sdk/upgrade_test"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap_complete.workspace = true
clap.workspace = true
colored.workspace = true
convert_case.workspace = true
env_logger.workspace = true
hex.workspace = true
home.workspace = true
humantime.workspace = true
indicatif.workspace = true
log.workspace = true
minijinja.workspace = true
move-binary-format.workspace = true
move-bytecode-verifier.workspace = true
move-compiler.workspace = true
move-package-alt.workspace = true
move-package-alt-compilation.workspace = true
move-unit-test.workspace = true
move-vm-config.workspace = true
move-vm-runtime.workspace = true
miette.workspace = true
num-format.workspace = true
prettytable.workspace = true
prometheus.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
sui-move-build.workspace = true
sui-adapter.workspace = true
sui-move-natives.workspace = true
sui-package-alt.workspace = true
sui-protocol-config.workspace = true
sui-types.workspace = true

[dependencies.nexus-sdk]
workspace = true
features = ["full", "move_publish"]

[dev-dependencies]
assert_matches = "1.5.0"
move-ir-to-bytecode.workspace = true
mockito.workspace = true
nexus-toolkit.workspace = true
rstest.workspace = true
schemars.workspace = true
serial_test.workspace = true
tempfile.workspace = true
tonic.workspace = true
warp.workspace = true

[dev-dependencies.nexus-sdk]
workspace = true
features = ["full", "move_publish", "test_utils"]
